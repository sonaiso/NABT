name: NTP recursive A116 training and replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nabt-ntp-recursive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ntp-recursive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python -m unittest tests.test_ntp_recursive tests.test_ntp_cli tests.test_ntp_runtime_integration tests.test_ntp_learning_contract tests.test_ntp_ifadah_learning tests.test_ntp_ifadah_gradients tests.test_io_gateway tests.test_ntl_pr_integration -v
      - name: Refit fixed training roots and compare every retained evaluation
        run: python -m tools.lexical_training.train_ntp_recursive --check
      - name: Replay the frozen source-bound program-selection experiment
        run: python -m tools.lexical_training.train_ntp_ifadah --check
      - name: Refit NABT comparison simulation and validate matched scoring
        run: make nabt-comparison-check
      - run: python -m tools.entropy_framework reuse --organization --summary
