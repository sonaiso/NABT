name: NABT grammar catalogue gates

on:
  pull_request:
    paths:
      - 'integrations/grammar_db/**'
      - 'integrations/inference_db/**'
      - 'integrations/mantuq_inference.mk'
      - 'tools/mantuq_inference/**'
      - 'tools/mantuq_sources.py'
      - 'tools/mantuq_inference_benchmark_adapter.py'
      - 'tools/benchmark_mantuq_inference.py'
      - 'tools/check_qualified_inference.py'
      - 'tests/test_mantuq*.py'
      - 'evidence/mantuq_inference_v1/**'
      - 'tools/grammar_catalog/**'
      - 'src/nabt/data/source_evidence/**'
      - 'evidence/arabic_completion_v6/**'
      - 'formal/theorems.json'
      - 'formal/**'
      - 'tools/proof_catalog.py'
      - 'tools/check_rule_routing.py'
      - 'tools/benchmark_grammar_catalog.py'
      - 'integrations/grammar_catalog.mk'
      - 'evidence/grammar_catalog_v1/**'
      - 'tests/test_grammar_catalog*.py'
      - 'tests/test_proof_catalog.py'
      - '.github/workflows/grammar-catalog-database.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/grammar_db/**'
      - 'integrations/inference_db/**'
      - 'integrations/mantuq_inference.mk'
      - 'tools/mantuq_inference/**'
      - 'tools/mantuq_sources.py'
      - 'tools/mantuq_inference_benchmark_adapter.py'
      - 'tools/benchmark_mantuq_inference.py'
      - 'tools/check_qualified_inference.py'
      - 'tests/test_mantuq*.py'
      - 'evidence/mantuq_inference_v1/**'
      - 'tools/grammar_catalog/**'
      - 'src/nabt/data/source_evidence/**'
      - 'evidence/arabic_completion_v6/**'
      - 'formal/theorems.json'
      - 'formal/**'
      - 'tools/proof_catalog.py'
      - 'tools/check_rule_routing.py'
      - 'tools/benchmark_grammar_catalog.py'
      - 'integrations/grammar_catalog.mk'
      - 'evidence/grammar_catalog_v1/**'
      - 'tests/test_grammar_catalog*.py'
      - 'tests/test_proof_catalog.py'
      - '.github/workflows/grammar-catalog-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-proof-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install verified Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Replay source links, compiled proof identities and routing
        run: make -f Makefile -f integrations/grammar_catalog.mk -f integrations/mantuq_inference.mk grammar-catalog proof-catalog routing-conformance mantuq-inference LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" EVIDENCE_DIR="${{ runner.temp }}/catalog-proof-links"
  postgres-pgvector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: nabt_test
          POSTGRES_USER: nabt_test
          # Ephemeral CI service only; not a deployment password.
          POSTGRES_PASSWORD: nabt_ephemeral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nabt_test -d nabt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src:.
      NABT_TEST_DATABASE_URL: postgresql://nabt_test:nabt_ephemeral_test@127.0.0.1:5432/nabt_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/grammar_db/requirements.txt
      - name: Source replay, SQL constraints and hybrid retrieval
        run: python -m unittest discover -s integrations/grammar_db/tests -v
      - name: Qualified inference provenance and vector search
        run: python -m unittest discover -s integrations/inference_db/tests -v
