name: NTL school inquiry and neural readout replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ntl-school-${{ github.ref }}
  cancel-in-progress: true

jobs:
  school-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install training-only numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Input, source, evidence revision and public gateway contracts
        run: make ntl-school-check
      - name: Refit frozen training split and replay retained evaluation
        run: python -m tools.lexical_training.train_apprentice --check
      - name: Check installed capability references
        run: |
          python -m tools.entropy_framework reuse --organization --summary
          python -m unittest tests.test_proof_reuse tests.test_proof_reuse_organization -v
