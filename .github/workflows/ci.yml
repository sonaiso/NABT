name: NABT proof and runtime gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Independent runtime tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Trusted artifact and source checks
        run: python tools/check_integrity.py
      - name: Learned artifact matches its deterministic acquisition
        run: python tools/export_learned_model.py --check
      - name: Replay actual Arabic sources and evidence revision
        run: python tools/source_learning_experiment.py --output "${{ runner.temp }}/nabt-source-learning.json"
      - name: Replay the published text-inquiry corpus and source-boundary probes
        env:
          PYTHONPATH: src
        run: python tools/text_inquiry_evaluation.py --code-freeze evidence/words/code_freeze_v3.json --output-dir "${{ runner.temp }}/nabt-text-regression"
      - name: Preserve independently measured Arabic coverage and safe deferrals
        env:
          PYTHONPATH: src
        run: python tools/arabic_syntax_evaluation.py --output-dir "${{ runner.temp }}/nabt-arabic-regression"
      - name: Replay published governor cues, certificates and bounded coverage
        env:
          PYTHONPATH: src
        run: python tools/governor_evaluation.py --output-dir "${{ runner.temp }}/nabt-governor-regression" --require-regression-gates
      - name: Preserve word-boundary checks and disclose the remaining positive coverage gap
        env:
          PYTHONPATH: src
        run: python tools/word_evaluation.py --output "${{ runner.temp }}/nabt-word-regression.json" --require-regression-gates
      - name: Install and run independently of the source checkout
        run: |
          python -m pip install .
          cp examples/text_theory.txt "${{ runner.temp }}/nabt-text-theory.txt"
          cp examples/text_inquiry_revision.json "${{ runner.temp }}/nabt-text-revision.json"
          cp examples/arabic_syntax_theory.txt "${{ runner.temp }}/nabt-arabic-theory.txt"
          cp examples/arabic_relation_theory.txt "${{ runner.temp }}/nabt-arabic-relation.txt"
          cp examples/arabic_syntax_revision.json "${{ runner.temp }}/nabt-arabic-revision.json"
          cp examples/governor_theory.txt "${{ runner.temp }}/nabt-governor-theory.txt"
          cp examples/governor_revision.json "${{ runner.temp }}/nabt-governor-revision.json"
          cp examples/word_boundaries.txt "${{ runner.temp }}/nabt-word-boundaries.txt"
          cd "${{ runner.temp }}"
          nabt pilot > nabt-pilot-receipt.json
          nabt verify-run nabt-pilot-receipt.json
          nabt ask-text nabt-text-theory.txt 'هل تقرير هو مفحوص؟' > nabt-text-receipt.json
          nabt verify-run nabt-text-receipt.json
          nabt run nabt-text-revision.json > nabt-text-revision-receipt.json
          nabt verify-run nabt-text-revision-receipt.json
          nabt ask-arabic nabt-arabic-theory.txt 'هل سالمٌ مدققٌ؟' > nabt-arabic-receipt.json
          nabt verify-run nabt-arabic-receipt.json
          nabt ask-arabic nabt-arabic-relation.txt 'هل سالم يراجع تقرير؟' > nabt-arabic-relation-receipt.json
          nabt verify-run nabt-arabic-relation-receipt.json
          nabt run nabt-arabic-revision.json > nabt-arabic-revision-receipt.json
          nabt verify-run nabt-arabic-revision-receipt.json
          nabt read-governors nabt-governor-theory.txt --with-number > nabt-governor-reading.json
          nabt ask-governors nabt-governor-theory.txt 'هل خالد هو متأهب؟' > nabt-governor-receipt.json
          nabt verify-run nabt-governor-receipt.json
          nabt run nabt-governor-revision.json > nabt-governor-revision-receipt.json
          nabt verify-run nabt-governor-revision-receipt.json
          nabt read-words nabt-word-boundaries.txt > nabt-word-reading.json
          nabt verify-words nabt-word-reading.json --source nabt-word-boundaries.txt

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install decompressor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
      - name: Install hash-verified Lean 4.34.1
        run: python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Kernel build and full export conformance
        run: python tools/check_conformance.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Audit theorem assumptions
        run: python tools/check_axioms.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Independent property-evidence table from Lean predicates
        run: python tools/check_property_evidence_table.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Arabic speech-force tags, entry profiles and numerical cell envelopes
        run: python -I tools/check_arabic_conformance.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Governor inventory, role-case numbers and all relevant partial assignments
        run: python -I tools/check_governor_conformance.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Word kinds, correlated class/case readings, and preserved source identities
        run: python -I tools/check_word_conformance.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
