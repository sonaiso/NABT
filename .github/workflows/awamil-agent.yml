name: NABT awamil agent

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabt-awamil-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the measured CPU training dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Replay the factors, relation matrix and real learning updates
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_awamil_agent tests.test_awamil_training -v
