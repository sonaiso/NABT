name: NABT optional neural morphology replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabt-neural-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-model-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install optional CPU learner without changing NABT runtime dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.__version__ == '2.5.1+cpu'"
      - name: Source identity, held-out labels, gradients and non-authoritative proposals
        run: python -m unittest discover -s tests -p 'test_neural_morphology_*.py' -v
      - name: Retrieve exact pinned research source
        run: python tools/fetch_masaq_training_source.py --output artifacts/local/ci/MASAQ.csv
      - name: Replay all 7705 test words, both baselines and the frozen book probe
        run: |
          python tools/replay_neural_morphology.py --source artifacts/local/ci/MASAQ.csv --model-dir evidence/source_morphology_training/run_01 --output artifacts/local/ci/neural-replay.json
          python tools/replay_neural_morphology.py --source artifacts/local/ci/MASAQ.csv --model-dir evidence/source_morphology_training/run_02 --output artifacts/local/ci/neural-replay-v2.json
      - name: Install decompressor for the official Lean archive
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zstd
      - name: Install pinned official Lean for Qatr teacher replay
        run: python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-qatr-tools"
      - name: Build Qatr reader and check learner boundaries
        env:
          PYTHONPATH: .
          NABT_QATR_READING: ${{ github.workspace }}/formal/.lake/build/bin/qatrReading
        run: |
          "${{ runner.temp }}/nabt-qatr-tools/lean-4.34.1-linux/bin/lake" --dir formal build qatrReading
          python -m unittest discover -s tests -p 'test_qatr_*.py' -v
      - name: Replay Qatr CPU weights and check every proposal in native Lean
        run: python tools/train_qatr_readings.py replay --source artifacts/local/ci/MASAQ.csv --lean formal/.lake/build/bin/qatrReading --output-dir evidence/qatr_lean_training/run_01
      - name: Independently replay source bindings for every Qatr prediction
        run: python tools/check_qatr_artifacts.py --source artifacts/local/ci/MASAQ.csv --lean formal/.lake/build/bin/qatrReading --model-dir evidence/qatr_lean_training/run_01
      - name: Qatr proposal interface retains alternatives and has no authority
        run: |
          python tools/propose_qatr_readings.py --text 'لَمْ تَفْعَلُوا' --target 1 --lean formal/.lake/build/bin/qatrReading > artifacts/local/ci/qatr-proposal.json
          python -c "import json; r=json.load(open('artifacts/local/ci/qatr-proposal.json')); assert r['authority']=='NONE' and not r['reading_licensed']; assert set(r['ranked_cases'])=={x['case'] for x in r['reading_rows']}; assert r['text'].encode()[r['target_start_byte']:r['target_end_byte']].decode()=='تَفْعَلُوا'"
      - name: Pinned Lisan source and explicit lexical interpretation replay
        run: |
          python tools/fetch_lisan_source.py --output artifacts/local/ci/lisan.txt
          python tools/build_lexical_catalog.py --lisan artifacts/local/ci/lisan.txt --check
      - name: Replay both lexical training runs including the failed neural candidate
        run: |
          python tools/train_lexical_retrieval.py replay --lisan artifacts/local/ci/lisan.txt --output-dir evidence/lexical_denotation/run_01
          python tools/train_lexical_weights.py replay --lisan artifacts/local/ci/lisan.txt --output-dir evidence/lexical_denotation/run_02
      - name: Lexical proposals preserve source bytes and never authorize a reading
        run: |
          python tools/propose_lexical_evidence.py --text 'معرفة الشيء بالقلب' --lisan artifacts/local/ci/lisan.txt --top-k 3 > artifacts/local/ci/lexical-proposal.json
          python -c "import json,pathlib; r=json.load(open('artifacts/local/ci/lexical-proposal.json')); b=pathlib.Path('evidence/classical_language/sources/maqayis.txt').read_bytes(); assert r['authority']=='NONE' and not r['reading_licensed']; assert all(b[p['start_byte']:p['end_byte']].decode()==p['source_entry'] for p in r['proposals'])"
