name: Build pinned PR109 validator repair
on:
  push:
    branches: [codex/ci-repair-114-workbench]
    paths: [.github/workflows/repair-109-build.yml, repair109/**]
permissions:
  contents: read
jobs:
  clear-helper-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel redundant validation of diagnostic branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          repo=os.environ['REPO']; branch='codex/ci-repair-114-workbench'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          root='https://api.github.com/repos/'+repo
          cancelled=[]
          for page in range(1,4):
              url=root+'/actions/runs?'+urllib.parse.urlencode({'branch':branch,'per_page':100,'page':page})
              data=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers)))
              runs=data['workflow_runs']
              for run in runs:
                  if run['head_branch']!=branch or run['event']!='push' or run['status']=='completed':continue
                  if run['id']==int(os.environ['SELF_RUN']) or run['name'].startswith(('Pinned PR','Build pinned PR')):continue
                  req=urllib.request.Request(root+'/actions/runs/'+str(run['id'])+'/cancel',data=b'',headers=headers,method='POST')
                  try:
                      urllib.request.urlopen(req).read();cancelled.append({'id':run['id'],'name':run['name'],'sha':run['head_sha']})
                  except urllib.error.HTTPError as error:
                      if error.code!=409:raise
              if len(runs)<100:break
          print(json.dumps({'scope':branch,'cancelled_helper_runs_only':cancelled},indent=2))
          PY
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            src
            tools
            tests
            integrations
            examples
            repair109
      - name: Build exact two-parent merge and check regression tests
        shell: bash
        run: |
          set -euo pipefail
          cp repair109/resolve.py "$RUNNER_TEMP/resolve109.py"
          cp repair109/test_relational_input_regression.py "$RUNNER_TEMP/test_relational_input_regression.py"
          git config user.name 'NABT CI repair'
          git config user.email '128359434+sonaiso@users.noreply.github.com'
          git checkout --detach 9720ef1bf4425afa317c2f49f5d936ba165082d9
          python "$RUNNER_TEMP/resolve109.py" "$RUNNER_TEMP/test_relational_input_regression.py"
          PYTHONPATH=src:. python -B -m unittest tests.test_relational_input_regression tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_withdrawing_actor_and_time_individually tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_conflict_and_refutation_have_different_denominators tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_scope_identity_and_duplicate_sources tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_empty_and_unenumerated_and_unsupported tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_alternatives_preserve_unknowns_and_mass_type tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_impossibility_requires_rule_and_scoped_membership tests.post_segmentation_routing.test_report_rank.ScopedRanks.test_attribution_changes_rank_only_with_matched_prior_evidence -v
          git commit -m 'merge: refresh scoped-report branch and fix relational validator regression'
          test "$(git rev-parse HEAD^1)" = 9720ef1bf4425afa317c2f49f5d936ba165082d9
          test "$(git rev-parse HEAD^2)" = aa2dba34332b19d9dd25d88f485986d0e93120fa
          git push --force-with-lease=refs/heads/codex/ci-repair-109-result: origin HEAD:refs/heads/codex/ci-repair-109-result
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo 'Original full native CI on the PR head remains mandatory before merge.'
