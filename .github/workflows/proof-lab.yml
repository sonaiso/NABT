name: NABT dynamic proof lab
run-name: "NABT Lab · ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || 'smoke' }}"

on:
  push:
    branches: [codex/dynamic-proof-lab]
  pull_request:
    paths:
      - 'tools/proof_lab.py'
      - 'tools/semantic_axes.py'
      - 'tools/benchmark_semantic_axes.py'
      - 'tools/*epistemic_measurement.py'
      - 'tests/test_epistemic*.py'
      - 'tools/*contextual_reference.py'
      - 'tests/test_contextual*.py'
      - 'evidence/contextual_semantics_v1/**'
      - 'formal/Nabt/ContextualReference.lean'
      - 'formal/ContextualReferenceMain.lean'
      - 'evidence/epistemic_measurement_v1/**'
      - 'formal/Nabt/EpistemicMeasurement.lean'
      - 'formal/EpistemicMeasurementMain.lean'
      - 'tools/attested_lexical_loader.py'
      - 'tests/test_attested_lexical_loader.py'
      - 'tests/test_lexical_loading*.py'
      - 'evidence/lexical_loading_v1/**'
      - 'tests/test_semantic_axes*.py'
      - 'evidence/semantic_axes_v1/**'
      - 'tools/lexical_testimony.py'
      - 'tools/lexical_transmission.py'
      - 'tools/licensed_workflow.py'
      - 'tools/transport_adapters.py'
      - 'src/nabt/transport_contract.py'
      - 'src/nabt/data/transport_command_contracts.json'
      - 'tools/linguistic_truth/**'
      - 'formal/Nabt/DiscourseBoundaryCueBridge.lean'
      - 'formal/DiscourseBoundaryCueMain.lean'
      - 'formal/DiscourseBoundaryCueChecks.lean'
      - 'formal/Nabt/SixNounAcquisition.lean'
      - 'formal/SixNounAcquisitionMain.lean'
      - 'formal/SixNounAcquisitionChecks.lean'
      - 'evidence/six_noun_acquisition_v1/**'
      - 'tests/test_six_noun*.py'
      - 'tests/test_transport_mode_replay.py'
      - 'tests/test_proof_lab_workflow.py'
      - 'formal/Nabt/ScopeAcquisition.lean'
      - 'formal/ScopeAcquisitionMain.lean'
      - 'formal/Nabt/LexicalTransmission.lean'
      - 'formal/LexicalTransmissionMain.lean'
      - 'tests/test_licensed_workflow*.py'
      - 'tests/test_legacy_cli_transport.py'
      - 'tests/test_transport_contract.py'
      - 'tests/test_discourse_boundary_cue.py'
      - 'evidence/discourse_boundary_v1/**'
      - 'evidence/legacy_migration_v2/**'
      - 'tests/test_lexical_transmission.py'
      - 'tests/test_scope_acquisition.py'
      - 'tests/test_lexical_testimony.py'
      - 'tests/test_proof_lab.py'
      - 'integrations/proof_lab/**'
      - '.github/workflows/proof-lab.yml'
  workflow_dispatch:
    inputs:
      request_id:
        description: Canonical lowercase version-4 UUID for this request
        required: true
        type: string
      payload:
        description: AES-GCM encrypted nabt.proof-lab-envelope.v1 JSON
        required: true
        type: string

permissions:
  contents: read

# GitHub permits one active and one pending run per group. A newer queued
# request can replace an older pending run; the UI must expose cancellation.
concurrency:
  group: nabt-proof-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-pinned encrypted transport dependencies
        run: python -m pip install --require-hashes -r integrations/proof_lab/requirements.txt
      - name: Validate bounded request before installing the checker
        id: prepare
        env:
          NABT_LAB_TRANSPORT_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.NABT_LAB_TRANSPORT_KEY || '' }}
        run: python tools/proof_lab.py --event-file "$GITHUB_EVENT_PATH" --prepare --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/nabt-lab/result.json"
      - name: Install hash-verified Lean toolchain
        if: steps.prepare.outputs.valid == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python tools/bootstrap_lean.py --destination "$RUNNER_TEMP/nabt-tools"
      - name: Acquire unchanged pinned annotation source for the selected profile
        if: steps.prepare.outputs.valid == 'true' && (steps.prepare.outputs.attested_source == 'true' || github.event_name != 'workflow_dispatch')
        run: python tools/fetch_qac_source.py --output artifacts/local/external/quranic-corpus-morphology-0.4.txt.gz
      - name: Build the installed native checker
        if: steps.prepare.outputs.valid == 'true'
        run: '"$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake" --dir formal build licensedInference lexicalDenotation epistemicMeasurement contextualReference lexicalSourceRows lexicalSurface linguisticTruth qualifiedCueLicensing lexicalTransmission scopeAcquisition sixNounAcquisition discourseBoundaryCue exportClassicalWeak exportClassicalHamza exportClassicalGemination exportClassicalBoundaryAffixes'
      - name: Worker transport and certificate boundary tests
        if: github.event_name != 'workflow_dispatch'
        run: node --test integrations/proof_lab/site/tests/*.test.mjs
      - name: Boundary and transport regression tests
        if: steps.prepare.outputs.valid == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          python -m unittest discover -s tests -p test_proof_lab.py -v
          python -m unittest tests.test_proof_lab_workflow -v
          NABT_TRANSPORT_REPLAY_OUTPUT="$RUNNER_TEMP/six-noun-replay" NABT_REQUIRE_NATIVE_TRANSPORT=1 python -m unittest tests.test_transport_mode_replay.ActualTransportModeReplay.test_six_noun_gateway_and_lab_replay_checked_and_deferred_constructions tests.test_transport_mode_replay.ActualTransportModeReplay.test_matrix_has_exact_gateway_operations_and_seven_proof_lab_modes -v
          for six_noun_case in checked unknown_companionship case_mismatch; do
            node integrations/proof_lab/site/scripts/validate-workflow-report.mjs "$RUNNER_TEMP/six-noun-replay/six_noun_$six_noun_case.json"
          done
          python -m unittest discover -s tests -p test_lexical_testimony.py -v
          python -m unittest discover -s tests -p 'test_semantic_axes*.py' -v
          python -m unittest discover -s tests -p 'test_attested_lexical_loader.py' -v
          python -m unittest discover -s tests -p 'test_lexical_loading*.py' -v
          python -m unittest discover -s tests -p 'test_epistemic*.py' -v
          python -m unittest discover -s tests -p 'test_contextual*.py' -v
      - name: Replay the frozen reference through both transport consumers
        if: steps.prepare.outputs.valid == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          python tools/benchmark_semantic_axes.py --output "$RUNNER_TEMP/semantic-axes.json"
          node integrations/proof_lab/site/scripts/validate-semantic-report.mjs "$RUNNER_TEMP/semantic-axes.json"
          python tools/benchmark_semantic_axes.py --lexical-profile attested_qac_v1 --output "$RUNNER_TEMP/semantic-axes-attested.json"
          node integrations/proof_lab/site/scripts/validate-semantic-report.mjs "$RUNNER_TEMP/semantic-axes-attested.json"
          python tools/benchmark_epistemic_measurement.py --require-native --output "$RUNNER_TEMP/epistemic-measurement.json"
          node integrations/proof_lab/site/scripts/validate-epistemic-report.mjs "$RUNNER_TEMP/epistemic-measurement.json"
          python tools/benchmark_contextual_reference.py --require-native --output "$RUNNER_TEMP/contextual-reference.json"
          node integrations/proof_lab/site/scripts/validate-contextual-report.mjs "$RUNNER_TEMP/contextual-reference.json"
      - name: Execute the exact request and retain its receipt
        if: always() && steps.prepare.outputs.valid == 'true'
        env:
          NABT_LAB_TRANSPORT_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.NABT_LAB_TRANSPORT_KEY || '' }}
        run: python tools/proof_lab.py --event-file "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/nabt-lab/result.json"
      - name: Retain bounded result only
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/nabt-lab/result.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          include-hidden-files: false
