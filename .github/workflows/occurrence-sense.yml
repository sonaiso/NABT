name: NABT occurrence sense and reference

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'src/nabt/**'
      - 'tools/occurrence_sense.py'
      - 'tools/benchmark_occurrence_sense.py'
      - 'tools/contextual_reference.py'
      - 'tools/lexical_completion.py'
      - 'tools/attested_lexical_loader.py'
      - 'tests/test_occurrence_sense*.py'
      - 'evidence/occurrence_sense_v1/**'
      - 'evidence/contextual_semantics_v1/**'
      - 'evidence/lexical_completion_v1/**'
      - 'evidence/lexical_loading_v1/**'
      - 'integrations/occurrence_sense.mk'
      - '.github/workflows/occurrence-sense.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-native-and-independent-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Replay the installed source catalogue and morphology matrix
        run: |
          python tools/fetch_lisan_source.py --output artifacts/local/lisan.txt
          python tools/fetch_qac_source.py --output artifacts/local/external/quranic-corpus-morphology-0.4.txt.gz
          python tools/build_lexical_completion.py --check
          python evidence/lexical_loading_v1/build_matrix.py --check
      - name: Install the pinned verified Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python tools/bootstrap_lean.py --destination "$RUNNER_TEMP/nabt-tools"
      - name: Build the actual native checkers and audit the kernel
        run: |
          "$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake" --dir formal build
          python tools/check_axioms.py --lake "$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/occurrence-sense-ci/axioms.json
      - name: Require native counterexample and boundary tests
        run: |
          test -x formal/.lake/build/bin/occurrenceSense
          test -x formal/.lake/build/bin/contextualReference
          test -x formal/.lake/build/bin/lexicalCompletion
          python -m unittest discover -s tests -p 'test_occurrence_sense*.py' -v
      - name: Measure frozen cases with separate safety and coverage denominators
        run: python tools/benchmark_occurrence_sense.py --require-native --require-safety --output artifacts/local/occurrence-sense-ci/benchmark.json
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occurrence-sense-evidence
          path: artifacts/local/occurrence-sense-ci/
          if-no-files-found: error
          retention-days: 14
