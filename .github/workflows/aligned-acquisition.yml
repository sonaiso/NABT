name: Aligned acquisition contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install decompressor and hash-verified Lean
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
          python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Native contracts and mutation tests
        run: make aligned-acquisition-conformance LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Replay exposed independent matrix with current committed inputs
        run: make aligned-acquisition-evaluation EVIDENCE_DIR=artifacts/local/ci-acquisition
