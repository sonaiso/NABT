name: Acquired knowledge connection

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nabt-source-connection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned and digest-checked Lean
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
          python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Acquire, learn, apply and revise through existing native checkers
        run: make -f tools/source_learning_connection.mk source-learning-connection LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" EVIDENCE_DIR=artifacts/local/ci-connection
      - name: Retain complete connection and independent replay
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acquired-knowledge-connection-evidence
          path: artifacts/local/ci-connection/
          if-no-files-found: warn
          retention-days: 14
