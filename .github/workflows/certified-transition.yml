name: Certified transition evidence

on:
  push:
    branches: [codex/certified-transition-witnesses]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certified-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned official Lean
        run: python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Kernel, native receipt, and independent measurement
        run: make certified-transition-conformance LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" EVIDENCE_DIR=artifacts/local/transition
      - name: Audit allowed axioms
        run: python tools/check_axioms.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/transition/axioms.json
      - name: Export candidate compiled catalogue and source links
        run: |
          python tools/proof_catalog.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/transition/catalog_references/proof_catalog.json
          python -m tools.grammar_catalog.links --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/transition/catalog_references/grammar_link_summary.json
          python -m tools.mantuq_inference.links --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/transition/catalog_references/mantuq_proof_links.json
          python -m tools.linguistic_truth.links --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/transition/catalog_references/linguistic_proof_links.json
          python -m tools.licensed_inference.links --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/transition/catalog_references/licensed_proof_links.json
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certified-transition-${{ github.sha }}
          path: artifacts/local/transition
          if-no-files-found: warn
