name: NABT sign curriculum

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabt-sign-curriculum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-curriculum:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Preserve frozen oracle build and workflow dependencies
        run: |
          python -B - <<'PY'
          from tools.interpretive_links_regression import check_dependencies
          snapshot = check_dependencies()
          print({"dependency_freeze_sha256": snapshot["sha256"], "files": len(snapshot["files"])})
          PY
      - name: Install hash-verified Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
          python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Build the existing native owners and check phonological correspondence
        run: |
          "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake" --dir formal build unitDiscoveryProbe progressiveUnitProbe alignedAcquisition exportPhonologicalModes temporalContextProbe
          python tools/check_phonological_modes.py --lake "${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Measure the sign curriculum through the native boundaries
        env:
          PYTHONPATH: src
        run: |
          test -x formal/.lake/build/bin/unitDiscoveryProbe
          test -x formal/.lake/build/bin/progressiveUnitProbe
          python -m tools.arabic_training.sign_curriculum native-check
          python -B -m unittest discover -s tests -p test_sign_curriculum.py -v
          mkdir -p artifacts/local/sign-curriculum
          python -m tools.arabic_training.sign_curriculum native-shapes --output artifacts/local/sign-curriculum/native-shapes.json
          python -m tools.arabic_training.sign_curriculum matrix --output artifacts/local/sign-curriculum/matrix.json
          python -m tools.arabic_training.sign_curriculum questions --output artifacts/local/sign-curriculum/questions.json
          python -m tools.arabic_training.sign_curriculum self-check --output artifacts/local/sign-curriculum/harness-self-check.json
          python -m tools.arabic_training.sign_curriculum probes --output artifacts/local/sign-curriculum/reader-probes.json
      - name: Check ordered composition and source-acquired cell effects
        run: |
          make -f Makefile -f integrations/grammar_catalog.mk unit-composition-agent EVIDENCE_DIR=artifacts/local/sign-curriculum
      - name: Bind i'rab occurrences, lower traces and scoped temporal premises
        run: |
          make -f Makefile -f integrations/grammar_catalog.mk context-application EVIDENCE_DIR=artifacts/local/sign-curriculum
      - name: Preserve measurements and their explicit scope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-curriculum
          path: artifacts/local/sign-curriculum
          if-no-files-found: error
          retention-days: 14
