name: NABT lexical completion scope

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'tools/lexical_completion.py'
      - 'tools/build_lexical_completion.py'
      - 'tools/benchmark_lexical_completion.py'
      - 'tools/lexical_testimony.py'
      - 'tools/lexical_training/data.py'
      - 'src/nabt/source_lexicon.py'
      - 'src/nabt/data/source_evidence/source_lexicon_v1.json'
      - 'evidence/lexical_completion_v1/**'
      - 'evidence/lexical_loading_v1/**'
      - 'tools/attested_lexical_loader.py'
      - 'tools/measure_lexical_loading.py'
      - 'evidence/lexical_denotation/**'
      - 'tests/test_lexical_completion.py'
      - 'tools/lexical_graph.py'
      - 'tools/build_lexical_graph.py'
      - 'tools/benchmark_lexical_graph.py'
      - 'tests/test_lexical_graph.py'
      - 'evidence/lexical_graph_v1/**'
      - 'evidence/completeness_review_v1/**'
      - 'tools/check_completeness_review.py'
      - 'tests/test_completeness_review.py'
      - 'docs/NABT_COMPLETENESS_PROOF.md'
      - 'integrations/lexical_graph.mk'
      - 'tools/linguistic_truth/**'
      - 'tools/benchmark_linguistic_truth.py'
      - 'tools/linguistic_truth_benchmark_adapter.py'
      - 'tools/measure_natural_use.py'
      - 'tests/test_linguistic_truth*.py'
      - 'tests/test_natural_use_measurement.py'
      - 'tools/benchmark_certified_natural_use.py'
      - 'tests/test_certified*.py'
      - 'tests/test_natural_use_sources.py'
      - 'evidence/certified_natural_use_v1/**'
      - 'evidence/progressive_rule_audit_v1/**'
      - 'evidence/source_acquisition_v1/**'
      - 'evidence/interface_migration_v1/**'
      - 'evidence/scope_acquisition_v1/**'
      - 'evidence/qualified_cue_licensing_v1/**'
      - 'tests/test_qualified_cue_benchmark.py'
      - 'tools/benchmark_qualified_cues.py'
      - 'tools/grammar_catalog/**'
      - 'tests/test_lexical_source_acquisition.py'
      - 'tests/test_qualified_cue_licensing.py'
      - 'tests/test_grammar_native_authority.py'
      - 'tests/test_source_acquisition*.py'
      - 'evidence/lexical_surface_binding_v1/**'
      - 'src/nabt/classical_certified.py'
      - 'src/nabt/classical_laws.py'
      - 'src/nabt/classical_weak.py'
      - 'src/nabt/classical_hamza.py'
      - 'src/nabt/classical_gemination.py'
      - 'src/nabt/classical_boundary_affixes.py'
      - 'tests/test_classical_certified.py'
      - 'tests/test_lexical_surface_binding.py'
      - 'Makefile'
      - 'evidence/natural_use_sources_v1/**'
      - 'evidence/natural_use_gap_v1/**'
      - 'evidence/linguistic_truth_v1/**'
      - 'src/nabt/data/source_evidence/mughni.txt'
      - 'integrations/linguistic_truth.mk'
      - '.github/workflows/lexical-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-and-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch and verify the complete pinned Lisan source
        run: python tools/fetch_lisan_source.py --output artifacts/local/lisan.txt
      - name: Replay exact citations and generated catalogue
        run: python tools/build_lexical_completion.py --check
      - name: Verify independent lexical witness matrix without changing source bytes
        run: |
          python tools/fetch_qac_source.py --output artifacts/local/external/quranic-corpus-morphology-0.4.txt.gz
          python evidence/lexical_loading_v1/build_matrix.py --check
      - name: Install verified Lean
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python tools/bootstrap_lean.py --destination "$RUNNER_TEMP/nabt-tools"
      - name: Build kernel and native executable
        run: '"$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake" --dir formal build Nabt lexicalCompletion linguisticTruth lexicalGraph lexicalSourceRows qualifiedCueLicensing'
      - name: Enforce transitive axiom audit
        run: python tools/check_axioms.py --lake "$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/lexical-completion-ci/axioms.json
      - name: Kernel-check completeness boundaries and failure receipts
        run: |
          python tools/check_completeness_review.py --lake "$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake" --output artifacts/local/lexical-completion-ci/completeness-review.json
          python -m unittest discover -s tests -p test_completeness_review.py -v
      - name: Require native tests with source replay
        run: |
          test -x formal/.lake/build/bin/lexicalCompletion
          test -s artifacts/local/lisan.txt
          python -m unittest discover -s tests -p test_lexical_completion.py -v
      - name: Run scope-separated controls and example
        run: |
          python tools/benchmark_lexical_completion.py --output artifacts/local/lexical-completion-ci/benchmark.json
          python tools/lexical_completion.py --request evidence/lexical_completion_v1/example_request.json > artifacts/local/lexical-completion-ci/example.json
      - name: Measure known natural-use gaps without changing their denominator
        run: |
          test -x formal/.lake/build/bin/linguisticTruth
          python -m unittest discover -s tests -p 'test_linguistic_truth*.py' -v
          python -m unittest discover -s tests -p test_natural_use_measurement.py -v
          python tools/measure_natural_use.py --before evidence/natural_use_gap_v1/benchmark_before.json.gz --save-run artifacts/local/lexical-completion-ci/natural-use-run.json.gz --output artifacts/local/lexical-completion-ci/natural-use.json
      - name: Verify source-bound graph and independent least-model oracle
        run: |
          test -x formal/.lake/build/bin/lexicalGraph
          python tools/build_lexical_graph.py --check --audit-output artifacts/local/lexical-completion-ci/graph-license-audit.json
          python -m unittest discover -s tests -p test_lexical_graph.py -v
          python tools/benchmark_lexical_graph.py --output artifacts/local/lexical-completion-ci/graph-benchmark.json
      - name: Require A116 and native Lean for named lexical proof claims
        run: |
          test -x formal/.lake/build/bin/linguisticTruth
          python -m unittest discover -s tests -p 'test_certified*.py' -v
          python -m unittest discover -s tests -p 'test_linguistic_truth_certified.py' -v
          python tools/benchmark_certified_natural_use.py --output artifacts/local/lexical-completion-ci/certified-natural-use.json.gz
      - name: Require exact lexical surfaces and native conditional classical controls
        run: make progressive-rule-conformance LAKE="$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Require native source acquisition and qualified cue licensing
        run: make source-acquisition-conformance LAKE="$RUNNER_TEMP/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Retain bounded verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lexical-completion-evidence
          path: artifacts/local/lexical-completion-ci/
          if-no-files-found: error
          retention-days: 14
