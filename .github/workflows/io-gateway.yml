name: NABT external I/O native gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabt-io-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-admission:
    runs-on: ubuntu-24.04
    # Native replay groups exceeded the old 15-minute whole-job budget.
    # Keep every admission check; allow build time and independent replays.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install decompressor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
      - name: Install hash-verified Lean
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Current proof catalogue
        run: |
          make proof-catalog LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Required native gateway admission
        run: |
          make io-gateway-native LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Relational continuity and alignment
        run: |
          make relational-bridge LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Case application and evidence revision
        run: |
          make case-application LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Scoped composition and independent replay
        run: |
          make scoped-composition LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
