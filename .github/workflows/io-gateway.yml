name: NABT external I/O native gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabt-io-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-checks:
    name: native-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    # The admission target alone took 51m25s on run 44534652804.
    # Give the remaining checks an independent runner and time budget.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: [gateway, replay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install decompressor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
      - name: Install hash-verified Lean
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/bootstrap_lean.py --destination "${{ runner.temp }}/nabt-tools"
      - name: Current proof catalogue
        run: |
          make proof-catalog LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Required native gateway admission
        if: matrix.suite == 'gateway'
        run: |
          make io-gateway-native LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Build the native readers for the independent replay runner
        if: matrix.suite == 'replay'
        run: |
          make io-gateway-build LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Relational continuity and alignment
        if: matrix.suite == 'replay'
        run: |
          make relational-bridge LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Case application and evidence revision
        if: matrix.suite == 'replay'
        run: |
          make case-application LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"
      - name: Scoped composition and independent replay
        if: matrix.suite == 'replay'
        run: |
          make scoped-composition LAKE="${{ runner.temp }}/nabt-tools/lean-4.34.1-linux/bin/lake"

  # Keep the existing required-check name. A skipped or cancelled matrix
  # must never be reported as a successful admission.
  native-admission:
    needs: native-checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native suites
        env:
          SUITES_RESULT: ${{ needs.native-checks.result }}
        run: test "$SUITES_RESULT" = success
